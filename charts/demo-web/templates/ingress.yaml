# The routing table. Hostname in -> Service out.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  annotations:
    # Auth CAN live here, outside the app.
    # The real test.ops.icos-tms.com uses auth-url / auth-signin here
    # to force an Entra ID sign-in before the app ever sees the request.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  number: 80
